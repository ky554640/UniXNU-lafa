name: lafa SM8850 XNU (realme GT8 Pro)

on:
  # The kernel step needs macOS, so every push that can affect the build starts
  # a run. Documentation-only commits are skipped to keep the macOS minutes.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'references/**'
      - 'proprietary-firmware/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lafa-xnu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: device
    steps:
      - name: Check out the lafa configuration
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare the isolated UniXNU source and check the board
        run: |
          python3 scripts/test-upstream.py
          TREE=$(./unixnu --prepare)
          echo "UNIXNU_TREE=$TREE" >> "$GITHUB_ENV"
          python3 "$TREE/scripts/test-kernel-source.py"
          python3 "$TREE/scripts/test-bootimg.py"
          python3 scripts/test-adt.py
          python3 "$TREE/drivers/DarwinBoot/Test/test-adt.py"
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I "$TREE/drivers/DarwinBoot/DarwinBootPkg/Driver" \
            drivers/BootProgress/Test/console.c -o /tmp/boot-progress-test
          ASAN_OPTIONS=detect_leaks=0 /tmp/boot-progress-test

      - name: Install host tools and check the SDK
        run: |
          brew install cmake ninja unifdef llvm mtools
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          df -h .

      - name: Fetch the kernel sources
        run: |
          mkdir -p out/lafa/logs
          ./unixnu defconfig lafa_defconfig
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily 2>&1 | tee out/lafa/logs/actions-fetch.log
          cp unixnu.lock out/lafa/unixnu.lock

      - name: Apply the board's native-driver patches
        run: |
          # Power the UFS controller back up (the stock ABL leaves it collapsed
          # and NativeUfs has no power-on code, so without this the kernel can
          # never read partitions), then widen the SMMU window from sheng's
          # SM8550 size (0xd0000) to SM8850's 1 MiB window, then exit the UniPro
          # link's HIBERN8 state (the SM8850 bootloader hands over with the link
          # asleep, so the first NOP OUT otherwise times out).
          python3 wsl_install/patch-native-ufs-poweron.py \
            "$UNIXNU_TREE/drivers/NativeUfs/NativeUfs.cpp" --check || \
          python3 wsl_install/patch-native-ufs-poweron.py \
            "$UNIXNU_TREE/drivers/NativeUfs/NativeUfs.cpp"
          python3 wsl_install/patch-native-ufs-smmu-window.py \
            "$UNIXNU_TREE/drivers/NativeUfs" --check || \
          python3 wsl_install/patch-native-ufs-smmu-window.py \
            "$UNIXNU_TREE/drivers/NativeUfs"
          python3 wsl_install/patch-native-ufs-hibern8-exit.py \
            "$UNIXNU_TREE/drivers/NativeUfs/NativeUfs.cpp" --check || \
          python3 wsl_install/patch-native-ufs-hibern8-exit.py \
            "$UNIXNU_TREE/drivers/NativeUfs/NativeUfs.cpp"

      - name: Build XNU and the FAT payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu build kernel payload -j 3 2>&1 | tee out/lafa/logs/actions-build.log

      - name: Check the native panic argument path
        run: |
          python3 drivers/BootProgress/Test/panic-entry.py out/lafa/tree/.cache/xnu-work \
            --font "$UNIXNU_TREE/drivers/DarwinBoot/DarwinBootPkg/Driver"

      - name: Upload the kernel, payload and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafa-xnu-${{ github.run_number }}
          path: |
            device/out/lafa/kernel/**
            device/out/lafa/payload/**
            device/out/lafa/logs/**
            device/out/lafa/unixnu.lock
          if-no-files-found: warn
          retention-days: 7

      # Artifacts need an authenticated session, so a checkout that only holds an
      # SSH key cannot fetch them. Release assets are public, which keeps the
      # build -> repack -> boot loop closed without handing out a token.
      - name: Publish the payload on the rolling ci-build release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automated build of ${{ github.sha }} at ${{ github.event.repository.updated_at }}."
          gh release view ci-build >/dev/null 2>&1 ||
            gh release create ci-build --title "Latest CI build" --notes "$notes"
          # The volume is 180 MiB of which ~91% is zero; the compressed copy is a few
          # MiB, which is what makes the download side of the loop bearable.
          gzip -9 -f -k out/lafa/payload/payload.img
          for f in out/lafa/payload/payload.img.gz out/lafa/kernel/kernel.macho out/lafa/kernel/kernel.json; do
            if [ -f "$f" ]; then gh release upload ci-build "$f" --clobber; fi
          done
          gh release upload ci-build out/lafa/logs/actions-build.log --clobber || true

      # The release CDN (objects.githubusercontent.com) is unreachable from some
      # networks, so also mirror the compressed payload onto an orphan `artifacts`
      # branch that can be fetched over the SSH git transport instead.
      - name: Mirror the payload to the artifacts branch
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p /tmp/artifacts && cd /tmp/artifacts
          git init -q
          git checkout -q --orphan artifacts 2>/dev/null || true
          cp -f "$GITHUB_WORKSPACE/device/out/lafa/payload/payload.img.gz" payload.img.gz
          cp -f "$GITHUB_WORKSPACE/device/out/lafa/kernel/kernel.macho" kernel.macho
          git add -f payload.img.gz kernel.macho
          git commit -q -m "artifacts: ${{ github.sha }}" || true
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" artifacts:artifacts
