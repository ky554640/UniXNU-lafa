[board]
name = "lafa"
soc = "SM8850"
description = "realme GT8 Pro (lafa) RMX5200: UniXNU bring-up"
kit = "lafa"

[kernel]
defconfig = "lafa_defconfig"
source_only = true
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-libpthread-kernel.py",
  "build-arm-platform.py",
]

[payload]
volume = "UNIXNULAF"
size_mib = 180
loader = "firmware"
title = "realme GT8 Pro (lafa) UniXNU"
dram_size = "0x20000000"
timeout = 10
# boot-progress is deliberately off for the log run: level 1 owns the panel and
# repaints it, which would overwrite the console text that says where the boot
# stopped. The console mirror added to UniXNULog needs that text to stay put.
kernel_args = ["-v", "serial=0", "debug=0x14e", "cpus=1",
               "kt_fixed_zones=240", "rd=md0",
               # native-ufs-probe=15 runs powerOnUfs(): power the UFS PHY GDSC and
               # clock branches back up, enable HCE, and report each register
               # transition. Read-only with respect to the storage. This is the
               # step toward native-ufs-root; the stock ABL leaves the controller
               # collapsed (probe=2 inspect confirmed GDSCR bit31=0, HCE=0).
               "native-ufs-probe=15"]

[payload.adt]
tool = "scripts/make-lafa-adt.py"
owned_memory_size = "0x10000000"
cpu_regs = "0"

[bootimg]
embed_payload = true
# Where the boot loader places the combined image (the ARM64 text_offset). This
# is the board's reserved "Kernel" region: a large contiguous window big enough
# for shim + firmware + payload, so the embedded payload stays here instead of
# clobbering the SEC/DXE heaps that live right after the firmware's run address.
load_base = "0xC7800000"

[firmware]
config = "lafa"
dsc = "Platforms/Realme/lafaPkg/lafa.dsc"
fd = "Build/lafaPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = [
  "Binaries",
  "Common/Mu",
  "Common/Mu_OEM_Sample",
  "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl",
]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Realme",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
]

[firmware.defines]
DEVICE_MODEL = "lafa"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "lafa-unixnu-20261029"
